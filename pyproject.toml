[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anscpy"
version = "0.1.0"
description = "Animal Science Python Toolkit"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Cintia Araujo", email = "cintia.m.araujo@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
full = ["pandas>=1.5", "matplotlib>=3.6", "openpyxl>=3.1"]
dev  = ["pytest>=7", "pytest-cov", "ruff"]
